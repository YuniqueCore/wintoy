<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">期货交易终端</title>
  <desc id="desc">红色卖盘、蓝色买盘与金色当前价组成的价格梯标志</desc>
  <defs>
    <linearGradient id="surface" x1="32" y1="20" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17243A"/>
      <stop offset="1" stop-color="#080D17"/>
    </linearGradient>
    <linearGradient id="ask" x1="132" y1="62" x2="206" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF776D"/>
      <stop offset="1" stop-color="#E93F4F"/>
    </linearGradient>
    <linearGradient id="bid" x1="50" y1="144" x2="124" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35A9FF"/>
      <stop offset="1" stop-color="#3973F4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="236" height="236" rx="52" fill="url(#surface)" filter="url(#shadow)"/>
  <rect x="11.5" y="11.5" width="233" height="233" rx="50.5" fill="none" stroke="#34455F" stroke-width="3"/>

  <!-- 中央价格轴：粗轮廓保证在 16x16 tray 尺寸仍可辨认。 -->
  <rect x="121" y="43" width="14" height="170" rx="7" fill="#F4F7FB"/>

  <!-- 卖盘价格梯。 -->
  <path d="M132 65H204 M132 90H184 M132 115H164"
        fill="none" stroke="url(#ask)" stroke-width="15" stroke-linecap="round"/>

  <!-- 买盘价格梯。 -->
  <path d="M124 143H92 M124 168H72 M124 193H52"
        fill="none" stroke="url(#bid)" stroke-width="15" stroke-linecap="round"/>

  <!-- 当前价：跨越买卖边界的金色高亮。 -->
  <path d="M88 129H168" fill="none" stroke="#FFC94A" stroke-width="13" stroke-linecap="round"/>
  <rect x="119" y="120" width="18" height="18" rx="4" transform="rotate(45 128 129)"
        fill="#FFF4C2" stroke="#FFC94A" stroke-width="4"/>
</svg>
